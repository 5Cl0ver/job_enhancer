<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0; padding: 14px; font-size: 14px;
        display: flex; flex-direction: column; min-height: 100vh;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      header .dot {
        width: 22px; height: 22px; border-radius: 6px; background: #16a34a;
        display: inline-flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 800; font-size: 12px;
      }
      header b { font-size: 15px; }
      .sub { color: #6b7280; font-size: 12px; margin: 0 0 12px; }
      label { display: block; margin: 8px 0 2px; font-size: 12px; font-weight: 600; }
      input[type="text"], input[type="email"], input[type="password"], select, textarea {
        width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
        border-radius: 8px; font-size: 13px; background: transparent; color: inherit;
      }
      textarea { resize: vertical; font-family: inherit; line-height: 1.45; }
      button { font-family: inherit; cursor: pointer; }
      button.primary {
        width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 9px;
        background: #16a34a; color: #fff; font-weight: 700; font-size: 14px;
      }
      button.dark { background: #111827; }
      button.ai { background: #7c3aed; }
      button.primary:disabled { opacity: .6; cursor: default; }
      button.ghost {
        padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 8px;
        background: transparent; color: inherit; font-weight: 600; font-size: 12px;
      }
      .error { color: #dc2626; font-size: 12px; margin: 8px 0 0; min-height: 14px; }
      .status { font-size: 12px; margin: 8px 0 0; min-height: 14px; }
      .status.ok { color: #16a34a; }

      /* Context card — what you're doing right now */
      .context {
        border: 1px solid #7c3aed55; background: rgba(124,58,237,.06);
        border-radius: 10px; padding: 10px 12px; margin-bottom: 4px;
      }
      .context .kicker {
        font-size: 10px; font-weight: 700; letter-spacing: .06em;
        color: #7c3aed; text-transform: uppercase; margin-bottom: 3px;
      }
      .context b { display: block; font-size: 13px; }
      .context span { color: #6b7280; font-size: 12px; }
      .context .ctx-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      .context .ctx-actions .done { color: #16a34a; font-weight: 700; font-size: 12px; }

      .saved { margin-top: 16px; }
      .saved h2 { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
      .saved h2 .count { color: #9ca3af; font-weight: 400; text-transform: none; letter-spacing: 0; }
      .saved ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .saved li {
        position: relative; border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 7px 9px; font-size: 12px; transition: border-color .12s, background .12s;
      }
      .saved li:hover { border-color: #16a34a; background: rgba(22,163,74,.04); }
      .saved li b { display: block; font-size: 13px; padding-right: 16px; }
      .saved li span { color: #6b7280; }
      .saved li a.open {
        position: absolute; top: 7px; right: 8px; text-decoration: none;
        color: #16a34a; font-weight: 700;
      }
      .saved li.muted { color: #9ca3af; text-align: center; padding: 12px; }
      .saved li .applied { display: inline-block; margin-top: 3px; color: #16a34a; font-weight: 600; }
      .saved li .mark-applied {
        display: inline-block; margin-top: 4px; padding: 2px 8px;
        border: 1px solid #d1d5db; border-radius: 999px; background: #fff;
        color: #374151; font-size: 11px; cursor: pointer;
      }
      .saved li .mark-applied:hover { border-color: #16a34a; color: #16a34a; }
      .saved li .mark-applied:disabled { opacity: .6; cursor: default; }
      #saved-all-list { max-height: 260px; overflow-y: auto; padding-right: 2px; }

      /* The job <select>: give it a solid, theme-correct background so its
         dropdown list isn't white-on-dark. */
      #cl-job { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        #cl-job, #cl-job option { background-color: #1f2937; color: #f3f4f6; }
      }
      .seg { display: flex; gap: 0; margin: 8px 0 2px; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
      .seg-btn {
        flex: 1; padding: 6px 8px; border: 0; background: transparent; color: inherit;
        font-size: 12px; font-weight: 600; cursor: pointer;
      }
      .seg-btn.on { background: #7c3aed; color: #fff; }
      .cl-row { display: flex; gap: 6px; margin-top: 6px; }
      #cl-output { margin-top: 8px; font-size: 12px; }

      footer { margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; }
      .link { background: none; border: 0; color: #6b7280; font-size: 12px; text-decoration: underline; padding: 0; }
      .version { color: #4b5563; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot">JE</span>
      <b>Job Enhancer</b>
    </header>

    <!-- Sign-in -->
    <div id="login-view" hidden>
      <p class="sub">Sign in once — then save jobs from any tab.</p>
      <form id="login-form">
        <label for="l-email">Email</label>
        <input id="l-email" type="email" required autocomplete="username" />
        <label for="l-password">Password</label>
        <input id="l-password" type="password" required autocomplete="current-password" />
        <button class="primary dark" type="submit">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <!-- Main -->
    <div id="main-view" hidden>
      <p class="sub">
        Save jobs with the green <b>Save</b> button on job pages — this panel
        follows what you're doing and helps you apply.
      </p>

      <!-- Context: what the active tab says you're doing right now -->
      <div id="context-card" class="context" hidden>
        <div id="context-kicker" class="kicker"></div>
        <b id="context-title"></b>
        <span id="context-sub"></span>
        <div id="context-actions" class="ctx-actions"></div>
      </div>

      <div class="saved" id="saved-all-wrap">
        <h2>Your saved jobs <span id="saved-all-count" class="count"></span></h2>
        <ul id="saved-all-list"></ul>
      </div>

      <!-- AI apply helper, right where you're applying -->
      <div class="saved" id="ai-wrap">
        <h2>AI apply helper</h2>
        <select id="cl-job"></select>
        <div class="seg" role="tablist">
          <button id="seg-cover" class="seg-btn on" type="button">Cover letter</button>
          <button id="seg-resume" class="seg-btn" type="button">Tailored resume</button>
        </div>
        <button id="cl-generate" class="primary ai" type="button">✍️ Write cover letter</button>
        <p id="cl-status" class="status"></p>
        <div id="cl-output-wrap" hidden>
          <textarea id="cl-output" rows="10" aria-label="Generated document"></textarea>
          <div class="cl-row">
            <button id="cl-copy" class="ghost" type="button">📋 Copy</button>
            <button id="cl-pdf" class="ghost" type="button">⬇ PDF</button>
            <button id="cl-regen" class="ghost" type="button">↻ Regenerate</button>
          </div>
        </div>
      </div>

      <footer>
        <button id="open-app" class="link" type="button">Open my tracker ↗</button>
        <!-- Build version — confirms which build Chrome actually loaded. -->
        <span id="je-version" class="version"></span>
        <button id="signout" class="link" type="button">Sign out</button>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
