<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 320px; margin: 0; padding: 16px; font-size: 14px;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; color: #6b7280; font-size: 12px; }
      label { display: block; margin: 8px 0 2px; font-size: 12px; font-weight: 600; }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; box-sizing: border-box; padding: 7px 9px;
        border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px;
      }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .row input[type="checkbox"] { margin: 0; }
      .row label { margin: 0; font-weight: 400; }
      button.primary {
        width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 8px;
        background: #111827; color: #fff; font-weight: 600; cursor: pointer;
      }
      button.primary:disabled { opacity: .6; cursor: default; }
      button.secondary {
        width: 100%; margin: 2px 0 12px; padding: 8px; border: 1px solid #d1d5db;
        border-radius: 8px; background: transparent; color: inherit;
        font-weight: 600; font-size: 13px; cursor: pointer;
      }
      button.link {
        margin-top: 10px; background: none; border: 0; color: #6b7280;
        font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0;
      }
      .error { color: #dc2626; font-size: 12px; margin: 8px 0 0; min-height: 14px; }
      .status { font-size: 12px; margin: 10px 0 0; min-height: 14px; }
      .status.ok { color: #16a34a; }
    </style>
  </head>
  <body>
    <!-- Sign-in view -->
    <div id="login-view" hidden>
      <h1>Job Enhancer</h1>
      <p class="sub">Sign in to save jobs to your tracker.</p>
      <form id="login-form">
        <label for="l-email">Email</label>
        <input id="l-email" type="email" required autocomplete="username" />
        <label for="l-password">Password</label>
        <input id="l-password" type="password" required autocomplete="current-password" />
        <button class="primary" type="submit">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <!-- Capture view -->
    <div id="capture-view" hidden>
      <h1>Save this job</h1>
      <p class="sub">
        Auto-filled below. If it's off, click <b>Pick from page</b> then click the
        job title.
      </p>
      <button id="pick-btn" class="secondary" type="button">🎯 Pick from page</button>
      <form id="save-form">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" required />
        <label for="f-company">Company</label>
        <input id="f-company" type="text" />
        <label for="f-location">Location</label>
        <input id="f-location" type="text" placeholder="Not specified" />
        <div class="row">
          <input id="f-remote" type="checkbox" />
          <label for="f-remote">Remote</label>
        </div>
        <input id="f-url" type="hidden" />
        <button class="primary" type="submit">Save to tracker</button>
        <p id="save-status" class="status"></p>
      </form>
      <button id="signout" class="link" type="button">Sign out</button>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
