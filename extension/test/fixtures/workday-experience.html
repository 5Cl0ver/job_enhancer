<!doctype html>
<!--
  Sanitized reconstruction of Workday's "My Experience" step (from a real
  myworkdayjobs.com capture). Two EMPTY work-experience blocks, using Workday's
  real automation-id markup, so we can test the filler against reality.
-->
<html>
  <body>
    <div data-automation-id="workExperienceSection">
      <div data-fkit-id="workExperience-1--null">
        <h5>Work Experience 1</h5>
        <div data-automation-id="formField-jobTitle" data-fkit-id="workExperience-1--jobTitle">
          <label>Job Title</label>
          <input type="text" id="workExperience-1--jobTitle" name="jobTitle" value="" />
        </div>
        <div data-automation-id="formField-companyName">
          <label>Company</label>
          <input type="text" id="workExperience-1--companyName" name="companyName" value="" />
        </div>
        <div data-automation-id="formField-location">
          <label>Location</label>
          <input type="text" id="workExperience-1--location" name="location" value="" />
        </div>
        <div data-automation-id="formField-currentlyWorkHere">
          <label>I currently work here</label>
          <input type="checkbox" id="workExperience-1--currentlyWorkHere" />
        </div>
        <div data-automation-id="formField-startDate">
          <div data-automation-id="dateInputWrapper">
            <input role="spinbutton" data-automation-id="dateSectionMonth-input" aria-label="Month" value="" />
            <input role="spinbutton" data-automation-id="dateSectionYear-input" aria-label="Year" value="" />
          </div>
        </div>
        <div data-automation-id="formField-endDate">
          <div data-automation-id="dateInputWrapper">
            <input role="spinbutton" data-automation-id="dateSectionMonth-input" aria-label="Month" value="" />
            <input role="spinbutton" data-automation-id="dateSectionYear-input" aria-label="Year" value="" />
          </div>
        </div>
        <div data-automation-id="formField-roleDescription">
          <label>Role Description</label>
          <textarea></textarea>
        </div>
      </div>

      <div data-fkit-id="workExperience-2--null">
        <h5>Work Experience 2</h5>
        <div data-automation-id="formField-jobTitle" data-fkit-id="workExperience-2--jobTitle">
          <label>Job Title</label>
          <input type="text" id="workExperience-2--jobTitle" name="jobTitle" value="" />
        </div>
        <div data-automation-id="formField-companyName">
          <label>Company</label>
          <input type="text" id="workExperience-2--companyName" name="companyName" value="" />
        </div>
        <div data-automation-id="formField-location">
          <label>Location</label>
          <input type="text" id="workExperience-2--location" name="location" value="" />
        </div>
        <div data-automation-id="formField-currentlyWorkHere">
          <label>I currently work here</label>
          <input type="checkbox" id="workExperience-2--currentlyWorkHere" />
        </div>
        <div data-automation-id="formField-startDate">
          <div data-automation-id="dateInputWrapper">
            <input role="spinbutton" data-automation-id="dateSectionMonth-input" aria-label="Month" value="" />
            <input role="spinbutton" data-automation-id="dateSectionYear-input" aria-label="Year" value="" />
          </div>
        </div>
        <div data-automation-id="formField-endDate">
          <div data-automation-id="dateInputWrapper">
            <input role="spinbutton" data-automation-id="dateSectionMonth-input" aria-label="Month" value="" />
            <input role="spinbutton" data-automation-id="dateSectionYear-input" aria-label="Year" value="" />
          </div>
        </div>
        <div data-automation-id="formField-roleDescription">
          <label>Role Description</label>
          <textarea></textarea>
        </div>
      </div>
      <button data-automation-id="add-button">Add Another</button>
    </div>
  </body>
</html>
