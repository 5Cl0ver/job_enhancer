<!doctype html>
<!--
  Sanitized Workday "Application Questions" page (from a real myworkdayjobs
  capture). Each question is a <button aria-haspopup="listbox"> inside a
  formField; the option list is rendered by Workday only after the button is
  clicked (the test simulates that).
-->
<html>
  <body>
    <div data-automation-id="applyFlowPrimaryQuestionsPage">
      <div data-automation-id="formField-q1">
        <fieldset>
          <legend>
            <div data-automation-id="richText"><p><b>Are you currently authorized for employment in the U.S. without any restrictions to the length of employment period?*</b></p></div>
          </legend>
          <button aria-haspopup="listbox" type="button" name="q1" id="primaryQuestionnaire--q1">Select One</button>
          <input type="text" class="hidden-value" value="" />
        </fieldset>
      </div>
      <div data-automation-id="formField-q2">
        <fieldset>
          <legend>
            <div data-automation-id="richText"><p><b>Will you now or in the future require visa sponsorship by U.S. Bank?*</b></p></div>
          </legend>
          <button aria-haspopup="listbox" type="button" name="q2" id="primaryQuestionnaire--q2">Select One</button>
          <input type="text" class="hidden-value" value="" />
        </fieldset>
      </div>
      <div data-automation-id="formField-q3">
        <fieldset>
          <legend>
            <div data-automation-id="richText"><p><b>Are you subject to an order of prohibition from banking by any federal agency?*</b></p></div>
          </legend>
          <button aria-haspopup="listbox" type="button" name="q3" id="primaryQuestionnaire--q3">Select One</button>
          <input type="text" class="hidden-value" value="" />
        </fieldset>
      </div>
    </div>
  </body>
</html>
