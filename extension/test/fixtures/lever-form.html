<!doctype html>
<html>
<head><title>Acme Corp - Backend Engineer</title></head>
<body>
  <div class="posting-headline"><h2>Backend Engineer</h2></div>
  <form id="application-form">
    <!-- Lever style: name attributes + placeholders, few labels -->
    <input name="name" type="text" placeholder="Full name✱" />
    <input name="email" type="email" placeholder="Email✱" />
    <input name="phone" type="text" placeholder="Phone" />
    <input name="org" type="text" placeholder="Current company" />
    <input name="urls[LinkedIn]" type="text" placeholder="LinkedIn URL" />
    <input name="urls[GitHub]" type="text" placeholder="GitHub URL" />
    <input name="urls[Portfolio]" type="text" placeholder="Portfolio URL" />
    <input name="location" type="text" placeholder="Current location" />
    <input name="resume" type="file" />
    <textarea name="comments" placeholder="Additional information"></textarea>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
