<!doctype html>
<!-- Lab page (invented company): the page's ONLY upload box is an unlabelled
     "Select files" inside a fieldset titled "Cover Letter". It is never the
     résumé's box (spec 031 review); the cover letter goes there, or nothing. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Apply - Contoso Health</title></head>
  <body>
    <h1>Support Engineer</h1>
    <form>
      <p><label for="fn">First Name</label><input id="fn"></p>
      <p><label for="em">Email</label><input id="em" type="email"></p>
      <fieldset>
        <legend>Cover Letter</legend>
        <div><span>Select files</span><input type="file" id="only-file" accept=".pdf,.docx"></div>
      </fieldset>
    </form>
  </body>
</html>
