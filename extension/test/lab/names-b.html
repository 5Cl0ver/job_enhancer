<!doctype html>
<!-- Lab page (invented company), spec 020: another site wording the same
     questions differently. A preferred name taught elsewhere fills here; the
     legal first name never does. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Application - Quillstone</title></head>
  <body>
    <h1>Application</h1>
    <form onsubmit="return false">
      <p><label for="first">First Name</label><input id="first"></p>
      <p><label for="nick">Preferred Name</label><input id="nick"></p>
      <p><label for="goes">What name do you go by?</label><input id="goes"></p>
      <p><label for="heard">How did you hear about us?</label><input id="heard"></p>
      <p><label for="team">Which team are you most excited about at our company?</label><input id="team"></p>
    </form>
  </body>
</html>
