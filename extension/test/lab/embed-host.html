<!doctype html>
<!-- Lab page (invented company): a careers page that embeds its application
     form from ANOTHER site in a frame (the frame's address is ?form=…). -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Careers · Vellacor Robotics</title></head>
  <body>
    <h1>Careers at Vellacor Robotics</h1>
    <p>Apply below.</p>
    <iframe id="apply" title="Application" width="640" height="700"></iframe>
    <script>document.getElementById("apply").src = new URLSearchParams(location.search).get("form");</script>
  </body>
</html>
