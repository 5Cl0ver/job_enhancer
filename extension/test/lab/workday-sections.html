<!doctype html>
<!-- Lab page (invented company and applicant): Workday's "My Experience" step
     as working open-source Workday fillers describe it (spec 020, research R4).
     - Work Experience: one row Workday pre-filled from its own résumé reading,
       wrongly (title cut at "(", a scrap in the description, no company), and
       an Add Another button that adds a row.
     - Education: a search-prompt school, a Degree list, years.
     - Languages: a Language list (long, draws only what's in view), "I am
       fluent", and a level list per ability; Add Another.
     - Websites: no rows until Add.
     - Skills: a search prompt; picks become chips.
     Lists are portalled pop-ups that close on Escape or a click elsewhere.
     Month/year boxes take a value only Workday's way (ArrowUp, or real typing):
     a value set by script alone is dropped when the box loses focus.
     window.__formData() holds what the PAGE has taken; window.__maxOpen() the
     most lists ever open at once; window.__redraw() rebuilds the job rows with
     the same values (Workday's Back, a resumed draft). ?preticked=1: Workday
     ticked "I currently work here" on row 1, which hides its To date.
     Skills (spec 037): ?slowSkills=<ms> the results come that much later (a
     server-side search); ?autopick Workday picks a lone result by itself,
     whatever it is; no result shows "No Items". -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Experience - Vellacor Robotics Careers</title>
    <style>
      body { font: 14px system-ui; margin: 16px; }
      [role=group] { border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
      .field { margin: 6px 0; }
      .pop { position: absolute; background: #fff; border: 1px solid #888; z-index: 10; }
      .pop ul { list-style: none; margin: 0; padding: 0; max-height: 192px; overflow: auto; }
      .pop li { height: 24px; line-height: 24px; padding: 0 6px; cursor: pointer; }
      .chips li { display: inline-block; border: 1px solid #aaa; border-radius: 8px; padding: 0 6px; margin: 2px; }
      input[data-automation-id^="dateSection"] { width: 4em; }
    </style>
  </head>
  <body>
    <div data-automation-id="mainContent">
      <h1 data-automation-id="jobPostingHeader">Field Service Technician</h1>
      <h2>My Experience</h2>

      <div aria-labelledby="Work-Experience-section"><h3 id="Work-Experience-section">Work Experience</h3>
        <div class="rows" id="work-rows"></div>
        <button type="button" data-automation-id="add-button" data-kind="work">Add Another</button></div>

      <div aria-labelledby="Education-section"><h3 id="Education-section">Education</h3>
        <div class="rows" id="edu-rows"></div>
        <button type="button" data-automation-id="add-button" data-kind="edu">Add Another</button></div>

      <div aria-labelledby="Languages-section"><h3 id="Languages-section">Languages</h3>
        <div class="rows" id="lang-rows"></div>
        <button type="button" data-automation-id="add-button" data-kind="lang">Add Another</button></div>

      <div aria-labelledby="Websites-section"><h3 id="Websites-section">Websites</h3>
        <div class="rows" id="url-rows"></div>
        <button type="button" data-automation-id="add-button" data-kind="url">Add</button></div>

      <div aria-labelledby="Skills-section"><h3 id="Skills-section">Skills</h3>
        <div class="field" data-automation-id="formField-skills"><label for="skills">Type to Add Skills</label>
          <div data-automation-id="multiSelectContainer"><ul class="chips" data-automation-id="selectedItemList"></ul>
            <input id="skills" placeholder="Search"></div></div></div>

      <button type="button" id="next" data-automation-id="pageFooterNextButton">Save and Continue</button>
    </div>
    <script>
      const data = {};
      window.__formData = () => JSON.parse(JSON.stringify(data));
      let open = 0, maxOpen = 0;
      window.__maxOpen = () => maxOpen;
      window.__openNow = () => open;
      const counts = { work: 0, edu: 0, lang: 0, url: 0 };
      const LANGS = ["Afrikaans","Albanian","Arabic","Armenian","Basque","Bengali","Bulgarian","Catalan","Chinese (Mandarin)","Croatian","Czech","Danish","Dutch","English","Estonian","Finnish","French","German","Greek","Gujarati","Hebrew","Hindi","Hungarian","Icelandic","Indonesian","Irish","Italian","Japanese","Korean","Latvian","Lithuanian","Malay","Norwegian","Persian","Polish","Portuguese","Punjabi","Romanian","Russian","Serbian","Slovak","Slovene","Somali","Spanish","Swahili","Swedish","Tagalog","Tamil","Thai","Turkish","Ukrainian","Urdu","Vietnamese","Welsh"];
      const LEVELS = ["1 - Beginner","2 - Classroom Study","3 - Intermediate","4 - Advanced","5 - Fluent"];
      const SKILLS = ["Python","Python Scripting","TypeScript","JavaScript","SQL","Azure","Azure DevOps","PowerShell","Jira","Confluence","REST APIs","GitHub Actions","Customer Service","Troubleshooting","Networking","Linux","Windows Server","Active Directory","Intune","HubSpot","Microsoft 365 Copilot for Sales","Office 365","Windows 10","Windows 11","Amazon Web Services (AWS)","Kubernetes (Container Orchestration)"];
      const params = new URLSearchParams(location.search);
      const slowSkills = Number(params.get("slowSkills") || 0);
      const autopick = params.has("autopick");
      const SCHOOLS = ["Harborview Community College","Harborview State University","Salem Technical Institute"];
      const DEGREES = ["High School Diploma","Associate's Degree","Bachelor's Degree","Master's Degree"];

      const text = (ff, label, id, value = "") => `<div class="field" data-automation-id="formField-${ff}"><label for="${id}">${label}</label><input id="${id}" value="${value}"></div>`;
      const list = (ff, label, id, options) => `<div class="field" data-automation-id="formField-${ff}"><label>${label}</label>
          <button type="button" aria-haspopup="listbox" aria-expanded="false" id="${id}" data-options="${options.join("|")}">Select One</button></div>`;
      const date = (ff, label, id, yearOnly = false) => `<div class="field" data-automation-id="formField-${ff}"><label>${label}</label>
          <div data-automation-id="dateInputWrapper">${yearOnly ? "" : `<input role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" id="${id}-m" placeholder="MM">`}
          <input role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" id="${id}-y" placeholder="YYYY"></div></div>`;
      const prompt = (ff, label, id) => `<div class="field" data-automation-id="formField-${ff}"><label for="${id}">${label}</label>
          <div data-automation-id="multiSelectContainer"><ul class="chips" data-automation-id="selectedItemList"></ul><input id="${id}" placeholder="Search"></div></div>`;

      const ROWS = {
        work: (n, pre = {}) => `<div role="group" aria-labelledby="Work-Experience-${n}-panel"><h4 id="Work-Experience-${n}-panel">Work Experience ${n}</h4>
          ${text("jobTitle", "Job Title", `w${n}-title`, pre.title || "")}${text("companyName", "Company", `w${n}-company`)}${text("location", "Location", `w${n}-location`)}
          <div class="field" data-automation-id="formField-currentlyWorkHere"><label><input type="checkbox" id="w${n}-current"> I currently work here</label></div>
          ${date("startDate", "From", `w${n}-from`)}${date("endDate", "To", `w${n}-to`)}
          <div class="field" data-automation-id="formField-roleDescription"><label for="w${n}-desc">Role Description</label><textarea id="w${n}-desc">${pre.desc || ""}</textarea></div></div>`,
        edu: (n) => `<div role="group" aria-labelledby="Education-${n}-panel"><h4 id="Education-${n}-panel">Education ${n}</h4>
          ${prompt("school", "School or University", `e${n}-school`)}${list("degree", "Degree", `e${n}-degree`, ["Select One", ...DEGREES])}
          ${text("fieldOfStudy", "Field of Study", `e${n}-field`)}${date("firstYearAttended", "From", `e${n}-from`, true)}${date("lastYearAttended", "To (Actual or Expected)", `e${n}-to`, true)}</div>`,
        lang: (n) => `<div role="group" aria-labelledby="Languages-${n}-panel"><h4 id="Languages-${n}-panel">Languages ${n}</h4>
          ${list("language", "Language", `l${n}-language`, ["Select One", ...LANGS])}
          <div class="field" data-automation-id="formField-native"><label><input type="checkbox" name="native" id="l${n}-native"> I am fluent in this language.</label></div>
          ${list("languageProficiency-c", "Comprehension", `l${n}-c`, ["Select One", ...LEVELS])}${list("languageProficiency-r", "Reading", `l${n}-r`, ["Select One", ...LEVELS])}
          ${list("languageProficiency-s", "Speaking", `l${n}-s`, ["Select One", ...LEVELS])}${list("languageProficiency-w", "Writing", `l${n}-w`, ["Select One", ...LEVELS])}</div>`,
        url: (n) => `<div role="group" aria-labelledby="Websites-${n}-panel"><h4 id="Websites-${n}-panel">Websites ${n}</h4>${text("url", "URL", `u${n}-url`)}</div>`,
      };
      const HOME = { work: "work-rows", edu: "edu-rows", lang: "lang-rows", url: "url-rows" };

      function addRow(kind, pre) {
        counts[kind]++;
        const box = document.getElementById(HOME[kind]);
        box.insertAdjacentHTML("beforeend", ROWS[kind](counts[kind], pre));
        wire(box.lastElementChild);
      }

      // ---- Pop-ups: closed by Escape, a pick, or a click on the page — but NOT
      // by opening another list (that's how lists end up stacked open).
      const pops = new Set(); // {pop, close, owner}
      function track(delta) {
        open += delta;
        maxOpen = Math.max(maxOpen, open);
      }
      document.addEventListener("click", (e) => {
        if (e.target.closest?.('button[aria-haspopup], [data-automation-id="multiSelectContainer"] input')) return;
        for (const p of [...pops]) if (!p.pop.contains(e.target)) p.close();
      }, true);

      function popupFor(owner, labels, onPick, { virtual = false } = {}) {
        const pop = document.createElement("div");
        pop.className = "pop";
        pop.setAttribute("data-automation-activepopup", "true");
        const ul = document.createElement("ul");
        ul.setAttribute("role", "listbox");
        pop.appendChild(ul);
        const ROW_H = 24;
        const draw = () => {
          const first = virtual ? Math.max(0, Math.min(labels.length - 8, Math.floor(ul.scrollTop / ROW_H))) : 0;
          const shown = virtual ? labels.slice(first, first + 8) : labels;
          ul.innerHTML = virtual ? `<li style="height:${first * ROW_H}px;padding:0" aria-hidden="true"></li>` : "";
          for (const label of shown) {
            const li = document.createElement("li");
            li.setAttribute("role", "option");
            li.innerHTML = '<div data-automation-id="promptOption"><div data-automation-id="promptLeafNode"></div></div>';
            li.querySelector('[data-automation-id="promptLeafNode"]').textContent = label;
            li.addEventListener("click", () => onPick(label));
            ul.appendChild(li);
          }
          if (virtual) ul.insertAdjacentHTML("beforeend", `<li style="height:${Math.max(0, labels.length - first - 8) * ROW_H}px;padding:0" aria-hidden="true"></li>`);
        };
        ul.addEventListener("scroll", draw);
        draw();
        const r = owner.getBoundingClientRect();
        pop.style.left = `${r.left + scrollX}px`;
        pop.style.top = `${r.bottom + scrollY}px`;
        document.body.appendChild(pop);
        track(1);
        const entry = { pop, owner };
        const close = () => {
          if (!pop.isConnected) return;
          pop.remove();
          track(-1);
          pops.delete(entry);
          owner.setAttribute?.("aria-expanded", "false");
        };
        entry.close = close;
        pops.add(entry);
        return { pop, close };
      }

      function wireList(btn) {
        const options = btn.dataset.options.split("|");
        let popped = null;
        btn.addEventListener("click", () => {
          if (popped?.pop.isConnected) return popped.close();
          popped = popupFor(btn, options, (label) => {
            btn.textContent = label;
            data[btn.id] = label;
            popped.close();
          }, { virtual: options.length > 12 });
          btn.setAttribute("aria-expanded", "true");
        });
        btn.addEventListener("keydown", (e) => e.key === "Escape" && popped?.close());
      }

      function wirePrompt(input, catalog) {
        const chips = input.parentElement.querySelector('[data-automation-id="selectedItemList"]');
        const add = (label) => {
          if ([...chips.children].some((c) => c.textContent === label)) return;
          const li = document.createElement("li");
          li.setAttribute("data-automation-id", "selectedItem");
          li.textContent = label;
          chips.appendChild(li);
          (data[input.id] ||= []).push(label);
          input.value = "";
        };
        let popped = null;
        let asked = 0; // only the latest search's results ever show
        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") return popped?.close();
          if (e.key !== "Enter") return;
          e.preventDefault();
          popped?.close();
          const q = input.value.trim().toLowerCase();
          const hits = catalog.filter((c) => c.toLowerCase().includes(q));
          const n = ++asked;
          const results = () => {
            if (n !== asked) return;
            // Workday picks a single exact match itself (?autopick: any lone result).
            if (hits.length === 1 && (autopick || hits[0].toLowerCase() === q)) return add(hits[0]);
            popped = popupFor(input, hits, (label) => {
              add(label);
              popped.close();
            }, { virtual: hits.length > 8 });
            if (!hits.length) popped.pop.insertAdjacentHTML("beforeend", "<p>No Items.</p>");
          };
          const slow = input.id === "skills" ? slowSkills : 0;
          if (slow) setTimeout(results, slow);
          else results();
        });
      }

      // Month/year boxes take a value Workday's way only: ArrowUp/ArrowDown or
      // real typing. A value set by script alone is dropped on blur.
      function wireSpin(input) {
        let kept = input.value || "";
        const max = input.dataset.automationId === "dateSectionMonth-input" ? 12 : 2100;
        const pad = (v) => (max === 12 ? String(v).padStart(2, "0") : String(v));
        input.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
          const n = Number.parseInt(input.value || "0", 10) + (e.key === "ArrowUp" ? 1 : -1);
          if (n < 1 || n > max) return;
          input.value = pad(n);
          kept = input.value;
          data[input.id] = kept;
        });
        input.addEventListener("input", (e) => {
          if (!e.isTrusted) return;
          kept = input.value;
          data[input.id] = kept;
        });
        input.addEventListener("blur", () => {
          if (input.value !== kept) input.value = kept;
        });
      }

      // "I currently work here" hides the row's To date while ticked (Workday's way).
      function wireCurrent(cb) {
        const to = cb.closest('[role="group"]').querySelector('[data-automation-id="formField-endDate"]');
        const sync = () => (to.hidden = cb.checked);
        cb.addEventListener("change", sync);
        cb.addEventListener("click", () => setTimeout(sync, 0));
        sync();
      }

      // Rebuild the job rows with the values they hold (new elements, same values).
      window.__redraw = () => {
        const box = document.getElementById("work-rows");
        const values = [...box.querySelectorAll("input, textarea")].map((el) => [el.id, el.type === "checkbox" ? el.checked : el.value]);
        const n = counts.work;
        box.innerHTML = "";
        counts.work = 0;
        for (let i = 0; i < n; i++) {
          counts.work++;
          box.insertAdjacentHTML("beforeend", ROWS.work(counts.work));
        }
        for (const [id, v] of values) {
          const el = document.getElementById(id);
          if (!el) continue;
          if (el.type === "checkbox") el.checked = v;
          else el.value = v;
        }
        for (const row of box.children) wire(row);
      };

      function wire(root) {
        for (const cb of root.querySelectorAll('[data-automation-id="formField-currentlyWorkHere"] input')) wireCurrent(cb);
        for (const b of root.querySelectorAll('button[aria-haspopup="listbox"]')) wireList(b);
        for (const s of root.querySelectorAll('input[role="spinbutton"]')) wireSpin(s);
        for (const i of root.querySelectorAll('[data-automation-id="multiSelectContainer"] input')) wirePrompt(i, i.id === "skills" ? SKILLS : SCHOOLS);
        for (const el of root.querySelectorAll('input:not([role=spinbutton]):not([placeholder=Search]), textarea')) {
          const save = () => (data[el.id] = el.type === "checkbox" ? el.checked : el.value);
          el.addEventListener("input", save);
          el.addEventListener("change", save);
        }
      }

      for (const btn of document.querySelectorAll('[data-automation-id="add-button"]')) btn.addEventListener("click", () => addRow(btn.dataset.kind));
      // Workday's own résumé reading filled one job, wrongly.
      addRow("work", { title: "Platform Engineer", desc: "Cloud &amp; Tooling) · Brightfold Labs" });
      if (params.get("preticked")) {
        const cb = document.getElementById("w1-current");
        cb.checked = true;
        cb.dispatchEvent(new Event("change"));
      }
      addRow("edu");
      addRow("lang");
      wire(document.querySelector('[data-automation-id="formField-skills"]'));
    </script>
  </body>
</html>
