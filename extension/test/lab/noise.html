<!doctype html>
<!-- Lab page: no application here — a sign-in form, a job search box, a
     comment box with an attachment, and a newsletter box. No autofill pill may appear. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Sign in · Tidewell Labs</title></head>
  <body>
    <form id="signin"><label for="u">Email</label><input id="u" type="email">
      <label for="p">Password</label><input id="p" type="password"><button>Sign in</button></form>
    <form id="search"><label for="q">Search jobs</label><input id="q" type="search"><button>Search</button></form>
    <form id="comment"><label for="c">Leave a comment</label><textarea id="c"></textarea>
      <label class="upload">Attach a file<input type="file" accept=".pdf,image/*" hidden></label><button>Post</button></form>
    <form id="news"><label for="n">Get our newsletter</label><input id="n" type="email"><button>Subscribe</button></form>
  </body>
</html>
