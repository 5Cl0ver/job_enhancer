<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Experience - Tidewell Labs Careers</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      section { margin-bottom: 24px; }
      .css-zone { border: 2px dashed #999; padding: 16px; }
      /* Like Workday: the file input itself is never shown. */
      .css-hidden-input { display: none; }
    </style>
  </head>
  <body>
    <!-- An invented page shaped like a real Workday "My Experience" step
         (spec 026, 029): the "Resume/CV" heading, then the field's own label
         "Upload a file (5MB max)*" (which never says résumé), the upload card
         (attachments-FileUpload), its drop zone and "Select files" button,
         and the hidden file input (no accept list) inside the drop zone. -->
    <h2>My Experience</h2>
    <section>
      <h3>Resume/CV</h3>
      <div data-automation-id="formField-file">
        <div><label>Upload a file (5MB max)<abbr title="required">*</abbr></label></div>
        <div data-automation-id="attachments-FileUpload">
          <div data-automation-id="file-upload-drop-zone" class="css-zone">
            <p>Drop file here</p>
            <p>or</p>
            <button type="button" data-automation-id="select-files" id="pick">Select files</button>
            <input type="file" multiple class="css-hidden-input" data-automation-id="file-upload-input-ref" id="input-3f9a" />
          </div>
        </div>
      </div>
      <p>Uploaded: <span id="got"></span></p>
    </section>
    <section>
      <label for="fn">First name</label>
      <input id="fn" name="firstName" autocomplete="given-name" />
      <label for="ln">Last name</label>
      <input id="ln" name="lastName" autocomplete="family-name" />
      <label for="why">Why do you want to work at Tidewell Labs?</label>
      <textarea id="why"></textarea>
    </section>
    <button type="button" id="next">Save and Continue</button>
    <script>
      document.getElementById("pick").addEventListener("click", () => document.getElementById("input-3f9a").click());
      document.getElementById("input-3f9a").addEventListener("change", (e) => {
        document.getElementById("got").textContent = [...e.target.files].map((f) => f.name).join(", ");
      });
    </script>
  </body>
</html>
