# Render Blueprint — deploys the FastAPI backend on the free tier.
# Frontend deploys separately on Vercel (root directory: frontend/).
# Free instances sleep after 15 min idle; .github/workflows/keep-alive.yml
# pings /health every 10 minutes so visitors never hit a cold start.

services:
  - type: web
    name: job-enhancer-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true # deploy on every push to the connected branch
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase pooler URL (postgresql+asyncpg://...:6543/postgres)
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false # AI phase — set to a placeholder until then
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://job-enhancer.vercel.app
      - key: MCP_PUBLIC_URL
        sync: false # bare origin of THIS service (no /mcp). Set AFTER first deploy
        # to enable the Claude connector; leave blank on the first deploy.
      - key: MAIL_ENC_KEY
        sync: false # Fernet key for email auto-status. Generate with:
        # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: DEBUG
        value: "false"
