openapi: 3.1.0
info:
  title: Job Enhancer API
  description: Job Search Assistant MVP — FastAPI backend
  version: 1.0.0
paths:
  /v1/jobs/:
    get:
      tags:
      - Jobs
      summary: Search Jobs
      description: Search jobs across Adzuna and JSearch, deduplicated and paginated.
      operationId: search_jobs_v1_jobs__get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          description: Search query
          title: Q
        description: Search query
      - name: location
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Location
      - name: remote_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Remote Only
      - name: salary_min
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Salary Min
      - name: salary_max
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Salary Max
      - name: experience
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(entry|mid|senior)$
          - type: 'null'
          title: Experience
      - name: job_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Type
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get Job
      description: Fetch a single job listing by ID.
      operationId: get_job_v1_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/saved-jobs/:
    get:
      tags:
      - SavedJobs
      summary: List Saved Jobs
      operationId: list_saved_jobs_v1_saved_jobs__get
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Collection Id
      - name: pipeline_stage_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pipeline Stage Id
      - name: is_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Is Archived
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedJobSchema'
                title: Response List Saved Jobs V1 Saved Jobs  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - SavedJobs
      summary: Save Job
      operationId: save_job_v1_saved_jobs__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedJobCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJobSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/saved-jobs/manual:
    post:
      tags:
      - SavedJobs
      summary: Save Manual Job
      description: Add a job found on an external site by URL + details (FR-004a).
      operationId: save_manual_job_v1_saved_jobs_manual_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualJobCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJobSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/saved-jobs/{saved_job_id}:
    patch:
      tags:
      - SavedJobs
      summary: Update Saved Job
      operationId: update_saved_job_v1_saved_jobs__saved_job_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: saved_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Saved Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedJobUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJobSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - SavedJobs
      summary: Delete Saved Job
      operationId: delete_saved_job_v1_saved_jobs__saved_job_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: saved_job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Saved Job Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/saved-searches/:
    get:
      tags:
      - SavedSearches
      summary: List Saved Searches
      operationId: list_saved_searches_v1_saved_searches__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SavedSearchSchema'
                type: array
                title: Response List Saved Searches V1 Saved Searches  Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - SavedSearches
      summary: Create Saved Search
      operationId: create_saved_search_v1_saved_searches__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearchSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/saved-searches/matches:
    get:
      tags:
      - SavedSearches
      summary: Get New Matches
      description: Jobs found since each saved search was last viewed.
      operationId: get_new_matches_v1_saved_searches_matches_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewMatchesResponse'
      security:
      - HTTPBearer: []
  /v1/saved-searches/mark-seen:
    post:
      tags:
      - SavedSearches
      summary: Mark Matches Seen
      operationId: mark_matches_seen_v1_saved_searches_mark_seen_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /v1/saved-searches/{search_id}:
    delete:
      tags:
      - SavedSearches
      summary: Delete Saved Search
      operationId: delete_saved_search_v1_saved_searches__search_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: search_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Search Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/collections/:
    get:
      tags:
      - Collections
      summary: List Collections
      operationId: list_collections_v1_collections__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CollectionSchema'
                type: array
                title: Response List Collections V1 Collections  Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Collections
      summary: Create Collection
      operationId: create_collection_v1_collections__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/collections/{collection_id}:
    get:
      tags:
      - Collections
      summary: Get Collection
      operationId: get_collection_v1_collections__collection_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Collections
      summary: Update Collection
      operationId: update_collection_v1_collections__collection_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Collections
      summary: Delete Collection
      operationId: delete_collection_v1_collections__collection_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pipeline-stages/:
    get:
      tags:
      - Tracker
      summary: List Stages
      operationId: list_stages_v1_pipeline_stages__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PipelineStageSchema'
                type: array
                title: Response List Stages V1 Pipeline Stages  Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Tracker
      summary: Create Stage
      operationId: create_stage_v1_pipeline_stages__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineStageCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStageSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/pipeline-stages/{stage_id}:
    patch:
      tags:
      - Tracker
      summary: Update Stage
      operationId: update_stage_v1_pipeline_stages__stage_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Stage Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineStageUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStageSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Tracker
      summary: Delete Stage
      operationId: delete_stage_v1_pipeline_stages__stage_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: stage_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Stage Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pipeline-stages/move:
    post:
      tags:
      - Tracker
      summary: Move Job
      description: Move a saved job to a different Kanban column.
      operationId: move_job_v1_pipeline_stages_move_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_move_job_v1_pipeline_stages_move_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJobSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/ai/resumes:
    get:
      tags:
      - AI
      summary: List Resumes
      operationId: list_resumes_v1_ai_resumes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ResumeSchema'
                type: array
                title: Response List Resumes V1 Ai Resumes Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - AI
      summary: Upload Resume
      operationId: upload_resume_v1_ai_resumes_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_resume_v1_ai_resumes_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/ai/generate:
    post:
      tags:
      - AI
      summary: Generate Document
      operationId: generate_document_v1_ai_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedDocumentCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocumentSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/ai/documents/{doc_id}:
    get:
      tags:
      - AI
      summary: Get Document
      operationId: get_document_v1_ai_documents__doc_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocumentSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - AI
      summary: Update Document
      operationId: update_document_v1_ai_documents__doc_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Doc Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedDocumentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedDocumentSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ai/documents/{doc_id}/pdf:
    get:
      tags:
      - AI
      summary: Download Document Pdf
      description: Render the latest content as PDF using weasyprint.
      operationId: download_document_pdf_v1_ai_documents__doc_id__pdf_get
      security:
      - HTTPBearer: []
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/me:
    get:
      tags:
      - Users
      summary: Get Profile
      operationId: get_profile_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Users
      summary: Delete Account
      description: 'Delete the current user account (FR-020).


        The account is deactivated immediately; all owned rows and stored

        files are permanently purged after a 30-day grace period by the

        daily `purge_deleted_users` job (cascade via FK).'
      operationId: delete_account_v1_users_me_delete
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
    patch:
      tags:
      - Users
      summary: Update Profile
      operationId: update_profile_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/users/me/export:
    get:
      tags:
      - Users
      summary: Export Data
      description: Serialize all user-owned data as a JSON download.
      operationId: export_data_v1_users_me_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/admin/stats:
    get:
      tags:
      - Admin
      summary: Get Stats
      operationId: get_stats_v1_admin_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
      security:
      - HTTPBearer: []
  /v1/admin/health:
    get:
      tags:
      - Admin
      summary: Get Health
      operationId: get_health_v1_admin_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceStatus'
                type: array
                title: Response Get Health V1 Admin Health Get
      security:
      - HTTPBearer: []
  /v1/admin/users:
    get:
      tags:
      - Admin
      summary: List Users
      operationId: list_users_v1_admin_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
                title: Response List Users V1 Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/analytics/summary:
    get:
      tags:
      - Analytics
      summary: Get Analytics Summary
      operationId: get_analytics_summary_v1_analytics_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
      security:
      - HTTPBearer: []
components:
  schemas:
    AnalyticsSummary:
      properties:
        total_saved:
          type: integer
          title: Total Saved
        total_applied:
          type: integer
          title: Total Applied
        total_interviews:
          type: integer
          title: Total Interviews
        response_rate:
          type: number
          title: Response Rate
        weekly_activity:
          items:
            $ref: '#/components/schemas/WeeklyActivity'
          type: array
          title: Weekly Activity
      type: object
      required:
      - total_saved
      - total_applied
      - total_interviews
      - response_rate
      - weekly_activity
      title: AnalyticsSummary
    Body_move_job_v1_pipeline_stages_move_post:
      properties:
        saved_job_id:
          type: string
          format: uuid
          title: Saved Job Id
        stage_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Stage Id
      type: object
      required:
      - saved_job_id
      title: Body_move_job_v1_pipeline_stages_move_post
    Body_upload_resume_v1_ai_resumes_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_resume_v1_ai_resumes_post
    CollectionCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
