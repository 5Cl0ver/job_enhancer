name: CI

on:
  push:
  pull_request:

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SUPABASE_URL: "https://example.supabase.co"
          NVIDIA_API_KEY: "test"
          ADZUNA_APP_ID: "test"
          ADZUNA_APP_KEY: "test"
          JSEARCH_API_KEY: "test"
        run: pytest --tb=short -q

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings 0

      - name: Component tests (Vitest)
        run: npm run test
        # Playwright E2E specs (tests/e2e/) need a live Supabase-backed stack;
        # they run locally / against staging, not in this headless job.

      - name: Build
        env:
          VITE_API_URL: "http://localhost:8000"
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "public-anon-key-for-ci"
        run: npm run build
