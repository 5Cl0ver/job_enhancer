# Job Catcher download (spec 019): every new Job Catcher version merged into
# main becomes a GitHub Release with a ready-to-load zip that points at the
# live app. The app's "Get Job Catcher" page links to
#   https://github.com/5Cl0ver/job_enhancer/releases/latest/download/job-catcher.zip
#
# Three jobs, least privilege:
# - check:   read-only token; which version, and is it released already?
# - build:   NO token at all. npm ci --ignore-scripts, build, write config.js
#            from repository VARIABLES (public values; fails if any is empty,
#            not https, or local), zip, verify, SHA-256, upload as an artifact.
# - publish: contents: write; no npm, no build. Downloads the artifact, checks
#            its SHA-256 matches what build reported, then creates the release.
# Third-party actions are pinned to full commit SHAs.
name: Job Catcher release

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/job-catcher-release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: job-catcher-release
  cancel-in-progress: false

jobs:
  check:
    name: Which version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: extension/manifest.json
          sparse-checkout-cone-mode: false
      - name: Read the version; is it released?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version extension/manifest.json)"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::manifest.json version '$version' isn't a plain version number"
            exit 1
          fi
          tag="job-catcher-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists: nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the zip (no token)
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: extension
    env:
      JC_API_BASE: ${{ vars.JC_API_BASE }}
      JC_APP_URL: ${{ vars.JC_APP_URL }}
      JC_SUPABASE_URL: ${{ vars.JC_SUPABASE_URL }}
      JC_SUPABASE_ANON_KEY: ${{ vars.JC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Build
        run: |
          set -euo pipefail
          # No package install scripts: nothing from npm runs during the install.
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Write config.js for the live app (refuse anything else)
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("fs");
          const cfg = {
            API_BASE: process.env.JC_API_BASE || "",
            APP_URL: process.env.JC_APP_URL || "",
            SUPABASE_URL: process.env.JC_SUPABASE_URL || "",
            SUPABASE_ANON_KEY: process.env.JC_SUPABASE_ANON_KEY || "",
          };
          const bad = [];
          for (const [k, v] of Object.entries(cfg)) {
            if (!v) bad.push(`${k} is empty`);
            if (/localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]/i.test(v)) bad.push(`${k} points at this computer`);
            if (k !== "SUPABASE_ANON_KEY") {
              let u;
              try { u = new URL(v); } catch { bad.push(`${k} isn't an address`); continue; }
              if (u.protocol !== "https:") bad.push(`${k} isn't https`);
              if (u.pathname !== "/" || u.search || u.hash) bad.push(`${k} must be just the site, no path`);
            }
          }
          if (bad.length) {
            for (const b of bad) console.log(`::error::${b}`);
            process.exit(1);
          }
          for (const k of ["API_BASE", "APP_URL", "SUPABASE_URL"]) cfg[k] = new URL(cfg[k]).origin;
          // The app must be the one Job Catcher lets ask for the Connect proof.
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const allowed = manifest.externally_connectable?.matches || [];
          if (!allowed.includes(`${cfg.APP_URL}/*`)) {
            console.log(`::error::manifest externally_connectable must list ${cfg.APP_URL}/* (it lists ${allowed.join(", ")})`);
            process.exit(1);
          }
          fs.writeFileSync(
            "config.js",
            "// Live Job Enhancer addresses (public values). Written by the release.\n" +
              `self.JOB_ENHANCER_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`,
          );
          EOF

      - name: Zip, check every file the manifest needs is inside, SHA-256
        id: zip
        run: |
          set -euo pipefail
          mkdir -p ../out
          zip -r -q ../out/job-catcher.zip manifest.json config.js icons dist
          unzip -Z1 ../out/job-catcher.zip > ../zip-contents.txt
          node <<'EOF'
          const fs = require("fs");
          const have = new Set(fs.readFileSync("../zip-contents.txt", "utf8").split(/\r?\n/).filter(Boolean));
          const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const need = new Set(["manifest.json", "config.js"]);
          if (m.background?.service_worker) need.add(m.background.service_worker);
          if (m.side_panel?.default_path) need.add(m.side_panel.default_path);
          for (const cs of m.content_scripts || []) for (const f of cs.js || []) need.add(f);
          for (const f of Object.values(m.icons || {})) need.add(f);
          for (const f of Object.values(m.action?.default_icon || {})) need.add(f);
          const missing = [...need].filter((f) => !have.has(f));
          if (missing.length) {
            console.log(`::error::missing from the zip: ${missing.join(", ")}`);
            process.exit(1);
          }
          for (const f of have) {
            if (/(^|\/)(\.env|node_modules)|\.pem$|\.map$/.test(f)) {
              console.log(`::error::should not ship: ${f}`);
              process.exit(1);
            }
          }
          console.log(`zip ok: ${have.size} files`);
          EOF
          sha="$(sha256sum ../out/job-catcher.zip | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-catcher-zip
          path: out/job-catcher.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [check, build]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the release notes (the notice file and the commit's subject):
      # nothing from the repo is run here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: extension/release-notices.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: job-catcher-zip
          path: out

      - name: Check the zip is the one build made, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          sha="$(sha256sum out/job-catcher.zip | cut -d' ' -f1)"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ || "$sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::the zip's SHA-256 ($sha) isn't the one build reported ($EXPECTED_SHA)"
            exit 1
          fi
          subject="$(git log -1 --pretty=%s)"
          # A one-time notice for this version, if extension/release-notices.txt
          # has a line "<version>: …" (0.35.0 changes the extension id).
          notice="$(grep -F "${VERSION}: " extension/release-notices.txt 2>/dev/null | head -1 | cut -d' ' -f2- || true)"
          VERSION="$VERSION" SHA="$sha" SUBJECT="$subject" NOTICE="$notice" node -e '
            const subject = process.env.SUBJECT.replace(/\s*\(#\d+\)$/, "").slice(0, 300);
            const notes = (process.env.NOTICE ? `${process.env.NOTICE} ` : "") + subject;
            require("fs").writeFileSync("out/latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: notes.slice(0, 500),
              sha256: process.env.SHA,
              published_at: new Date().toISOString(),
            }, null, 2) + "\n");
            require("fs").writeFileSync("out/release-notes.md",
              `${process.env.NOTICE ? `**${process.env.NOTICE}**\n\n` : ""}${subject}\n\nDownload job-catcher.zip, unzip it into a folder you keep, then load it in chrome://extensions (Developer mode → Load unpacked). Updating: unzip over the same folder and press reload.\n\nSHA-256 of job-catcher.zip: \`${process.env.SHA}\`\n`);
          '
          gh release create "$TAG" out/job-catcher.zip out/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Job Catcher $VERSION" \
            --notes-file out/release-notes.md \
            --latest
