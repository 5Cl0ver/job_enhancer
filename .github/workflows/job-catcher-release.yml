# Job Catcher download (spec 019): every new Job Catcher version merged into
# main becomes a GitHub Release with a ready-to-load zip that points at the
# live app. The app's "Get Job Catcher" page links to
#   https://github.com/5Cl0ver/job_enhancer/releases/latest/download/job-catcher.zip
#
# Safety:
# - The zip's config.js is built from repository VARIABLES (public values) and
#   the release FAILS if any is empty, not https://, or points at localhost.
# - Only GITHUB_TOKEN is used; only the release job may write, and only contents.
# - Third-party actions are pinned to full commit SHAs.
# - latest.json and the release notes carry the zip's SHA-256.
name: Job Catcher release

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/job-catcher-release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: job-catcher-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Job Catcher zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: extension
    env:
      JC_API_BASE: ${{ vars.JC_API_BASE }}
      JC_APP_URL: ${{ vars.JC_APP_URL }}
      JC_SUPABASE_URL: ${{ vars.JC_SUPABASE_URL }}
      JC_SUPABASE_ANON_KEY: ${{ vars.JC_SUPABASE_ANON_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Which version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::manifest.json version '$version' isn't a plain version number"
            exit 1
          fi
          tag="job-catcher-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists: nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Write config.js for the live app (refuse anything else)
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("fs");
          const cfg = {
            API_BASE: process.env.JC_API_BASE || "",
            APP_URL: process.env.JC_APP_URL || "",
            SUPABASE_URL: process.env.JC_SUPABASE_URL || "",
            SUPABASE_ANON_KEY: process.env.JC_SUPABASE_ANON_KEY || "",
          };
          const bad = [];
          for (const [k, v] of Object.entries(cfg)) {
            if (!v) bad.push(`${k} is empty`);
            if (/localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]/i.test(v)) bad.push(`${k} points at this computer`);
            if (k !== "SUPABASE_ANON_KEY") {
              let u;
              try { u = new URL(v); } catch { bad.push(`${k} isn't an address`); continue; }
              if (u.protocol !== "https:") bad.push(`${k} isn't https`);
              if (u.pathname !== "/" || u.search || u.hash) bad.push(`${k} must be just the site, no path`);
            }
          }
          if (bad.length) {
            for (const b of bad) console.log(`::error::${b}`);
            process.exit(1);
          }
          for (const k of ["API_BASE", "APP_URL", "SUPABASE_URL"]) cfg[k] = new URL(cfg[k]).origin;
          // The app must be the one Job Catcher lets ask for the Connect proof.
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const allowed = manifest.externally_connectable?.matches || [];
          if (!allowed.includes(`${cfg.APP_URL}/*`)) {
            console.log(`::error::manifest externally_connectable must list ${cfg.APP_URL}/* (it lists ${allowed.join(", ")})`);
            process.exit(1);
          }
          fs.writeFileSync(
            "config.js",
            "// Live Job Enhancer addresses (public values). Written by the release.\n" +
              `self.JOB_ENHANCER_CONFIG = ${JSON.stringify(cfg, null, 2)};\n`,
          );
          EOF

      - name: Zip and check every file the manifest needs is inside
        if: steps.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          rm -f ../job-catcher.zip
          zip -r -q ../job-catcher.zip manifest.json config.js icons dist
          unzip -Z1 ../job-catcher.zip > ../zip-contents.txt
          node <<'EOF'
          const fs = require("fs");
          const have = new Set(fs.readFileSync("../zip-contents.txt", "utf8").split(/\r?\n/).filter(Boolean));
          const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const need = new Set(["manifest.json", "config.js"]);
          if (m.background?.service_worker) need.add(m.background.service_worker);
          if (m.side_panel?.default_path) need.add(m.side_panel.default_path);
          for (const cs of m.content_scripts || []) for (const f of cs.js || []) need.add(f);
          for (const f of Object.values(m.icons || {})) need.add(f);
          for (const f of Object.values(m.action?.default_icon || {})) need.add(f);
          const missing = [...need].filter((f) => !have.has(f));
          if (missing.length) {
            console.log(`::error::missing from the zip: ${missing.join(", ")}`);
            process.exit(1);
          }
          for (const f of have) {
            if (/(^|\/)(\.env|node_modules)|\.pem$|\.map$/.test(f)) {
              console.log(`::error::should not ship: ${f}`);
              process.exit(1);
            }
          }
          console.log(`zip ok: ${have.size} files`);
          EOF

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd ..
          sha="$(sha256sum job-catcher.zip | cut -d' ' -f1)"
          subject="$(git log -1 --pretty=%s)"
          VERSION="$VERSION" SHA="$sha" SUBJECT="$subject" node -e '
            const notes = process.env.SUBJECT.replace(/\s*\(#\d+\)$/, "").slice(0, 300);
            require("fs").writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes,
              sha256: process.env.SHA,
              published_at: new Date().toISOString(),
            }, null, 2) + "\n");
            require("fs").writeFileSync("release-notes.md",
              `${notes}\n\nDownload job-catcher.zip, unzip it into a folder you keep, then load it in chrome://extensions (Developer mode → Load unpacked). Updating: unzip over the same folder and press reload.\n\nSHA-256 of job-catcher.zip: \`${process.env.SHA}\`\n`);
          '
          gh release create "$TAG" job-catcher.zip latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Job Catcher $VERSION" \
            --notes-file release-notes.md \
            --latest
