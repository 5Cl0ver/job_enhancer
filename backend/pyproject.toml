[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-enhancer-backend"
version = "0.1.0"
description = "Job Search Assistant MVP - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",

    # Auth — Supabase JWT verification
    "python-jose[cryptography]>=3.3.0",

    # Encrypting mailbox app-passwords at rest (Fernet)
    "cryptography>=42.0.0",

    # Claude connector (remote MCP server + Supabase OAuth resource server)
    "fastmcp>=3.4.0",

    # AI
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-core>=0.3.0",

    # Job APIs
    "httpx>=0.27.0",

    # Deduplication
    "rapidfuzz>=3.9.0",

    # Resume parsing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",

    # PDF generation
    "fpdf2>=2.7.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Background tasks
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "aiosqlite>=0.20.0",
    "ruff==0.16.4", # pinned exactly so local == CI (unpinned caused format drift)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework idiom
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long system-prompt string literals read best left unwrapped
"app/services/ai_service.py" = ["E501"]
# SQLAlchemy string forward references in Mapped[...] annotations
"app/models/*.py" = ["F821", "E402"]
"app/models/__init__.py" = ["E402", "F401"]
# Lifespan-scoped imports avoid circular imports at module load
"app/main.py" = ["E402"]
# Migrations, seed scripts, and test fixtures carry long inline literals
"alembic/**" = ["E501"]
"scripts/**" = ["E501"]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
