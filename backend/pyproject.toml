[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-enhancer-backend"
version = "0.1.0"
description = "Job Search Assistant MVP - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",

    # Auth
    "fastapi-nextauth-jwt>=0.1.0",
    "python-jose[cryptography]>=3.3.0",

    # AI
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-core>=0.3.0",

    # Job APIs
    "httpx>=0.27.0",

    # Deduplication
    "rapidfuzz>=3.9.0",

    # Resume parsing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",

    # PDF generation
    "weasyprint>=62.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Background tasks
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
