<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Enhancer</title>
    <meta
      name="description"
      content="Find jobs from every board in one place, track applications, and apply faster."
    />
    <!--
      Set the theme class before first paint to avoid a flash of the wrong theme.
      Mirrors the logic in src/components/theme-provider.tsx (default: system).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full">
    <!-- React mounts here. Vite injects the bundled script below. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
